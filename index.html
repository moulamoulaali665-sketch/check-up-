<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM STRESS TEST PRO</title>
    <style>
        body { 
            background: #000; 
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        #ui-container { margin-top: 25vh; }
        .warning-box {
            border: 2px solid #ff0000;
            padding: 30px;
            display: inline-block;
            border-radius: 15px;
            box-shadow: 0 0 20px #ff0000;
            background: rgba(20, 0, 0, 0.8);
        }
        h1 { font-size: 2.5em; color: #ff0000; text-transform: uppercase; }
        p { font-size: 1.2em; color: #ccc; }
        
        button { 
            background: #ff0000; 
            color: #fff; 
            border: none; 
            padding: 20px 60px; 
            font-size: 24px; 
            cursor: pointer; 
            font-weight: bold;
            margin-top: 25px;
            border-radius: 5px;
            box-shadow: 0 5px 0 #800;
            transition: 0.1s;
        }
        button:active { transform: translateY(5px); box-shadow: none; }

        /* The Hidden Hacker/Scary Overlay */
        #scary-overlay {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #000 url('https://i.imgur.com/H6SAnZ9.gif') no-repeat center center;
            background-size: cover; 
            z-index: 9999;
        }
        .hacker-label {
            color: #ff0000;
            font-size: clamp(50px, 15vw, 120px);
            font-weight: 900;
            margin-top: 25vh;
            text-shadow: 0 0 30px #fff, 0 0 50px #ff0000;
            animation: glitch 0.1s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

<div id="scary-overlay">
    <div class="hacker-label">HACKER</div>
</div>

<div id="ui-container">
    <div class="warning-box">
        <h1>Extreme Stress Test</h1>
        <p>Target: 16GB RAM / High-End SOC</p>
        <p style="color: #ffcc00;">Status: Ready for Deployment</p>
        <button onclick="launch()">START OVERLOAD</button>
    </div>
</div>

<script>
    function launch() {
        // 1. Show the Hacker Overlay immediately
        document.getElementById('scary-overlay').style.display = 'block';
        document.getElementById('ui-container').style.display = 'none';
