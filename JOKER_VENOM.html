<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE SYSTEM STRESS TEST</title>
    <style>
        body { 
            background: #000; 
            color: #ff0000; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            margin: 0;
            overflow: hidden;
        }
        .warning-banner { 
            font-size: 20px; 
            color: #fff; 
            background: #f00; 
            padding: 15px; 
            font-weight: bold;
            animation: blinker 0.6s linear infinite; 
        }
        @keyframes blinker { 50% { opacity: 0; } }
        
        #stats-container { 
            margin: 50px auto; 
            padding: 20px;
            border: 2px dashed #00ff00;
            width: 80%;
        }
        #ram-counter { font-size: 60px; color: #00ff00; }
        .label { font-size: 18px; color: #888; }
        
        #launch-btn { 
            width: 90%; 
            height: 120px; 
            font-size: 35px; 
            background: #111; 
            color: #f00; 
            border: 4px solid #f00; 
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        #launch-btn:active { background: #f00; color: #000; }
    </style>
</head>
<body>

    <div class="warning-banner">⚠️ EXTREME RESOURCE CONSUMPTION DETECTED ⚠️</div>

    <div id="stats-container">
        <div class="label">ALLOCATED MEMORY</div>
        <div id="ram-counter">0 MB</div>
        <div class="label">STRESSING ALL CPU CORES...</div>
    </div>

    <button id="launch-btn" onclick="igniteEngine()">Launch Attack</button>

    <script>
        let memoryVault = [];
        let isActive = false;

        function igniteEngine() {
            if(isActive) return;
            isActive = true;
            
            document.getElementById('launch-btn').innerText = "ENGINE RUNNING...";
            document.getElementById('launch-btn').style.borderColor = "#00ff00";
            document.getElementById('launch-btn').style.color = "#00ff00";

            // 1. MULTI-THREADED CPU ATTACK
            // Creating 20 Background Workers to bypass Main Thread limits
            const stressLogic = `while(true) { Math.sqrt(Math.random() * 8888.88); }`;
            const blob = new Blob([stressLogic], {type: 'application/javascript'});
            const blobUrl = URL.createObjectURL(blob);

            for (let i = 0; i < 24; i++) {
                new Worker(blobUrl);
            }

            // 2. RAM ALLOCATION OVERFLOW
            // Injecting 250MB every 500ms
            setInterval(() => {
                try {
                    for (let j = 0; j < 250; j++) {
                        let buffer = new Uint8Array(1024 * 1024); // 1MB Physical Block
                        buffer.fill(0xFF); // Forcing physical write to RAM
                        memoryVault.push(buffer);
                    }
                    document.getElementById('ram-counter').innerText = memoryVault.length + " MB";
                } catch(error) {
                    console.log("Memory Limit Reached!");
                }
            }, 500);
        }
    </script>
</body>
</html>
